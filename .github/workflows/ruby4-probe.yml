name: Ruby compatibility investigation

on:
  push:
    branches:
      - ci/ruby-4-compatibility-probe

permissions:
  contents: read

jobs:
  safemode:
    if: false
    name: safemode Ruby ${{ matrix.ruby }} hardening ${{ matrix.hardening }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '4.0.7'
            os: ubuntu-26.04
            hardening: true
    steps:
      - uses: actions/checkout@v7
        with:
          repository: jakduch/safemode
          ref: fix/54-ruby-4
          fetch-depth: 0
      - name: Test together with proposed node allowlist hardening
        if: matrix.hardening
        run: |
          git fetch https://github.com/theforeman/safemode.git refs/pull/70/head
          git diff "$(git merge-base HEAD FETCH_HEAD)" FETCH_HEAD -- lib/safemode/parser.rb test/test_parser_node_allowlist.rb | git apply --3way
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  ldap:
    if: false
    name: ldap_fluff Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '2.7'
            os: ubuntu-24.04
          - ruby: '3.0'
            os: ubuntu-24.04
          - ruby: '3.3'
            os: ubuntu-26.04
          - ruby: '4.0.7'
            os: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: jakduch/ldap_fluff
          ref: feature/ruby-4-support
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake MT_KWARGS_HACK=1

  postgres:
    if: github.repository == 'jakduch/foreman'
    name: Foreman logging and schema Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.0'
            os: ubuntu-24.04
          - ruby: '3.3'
            os: ubuntu-26.04
          - ruby: '4.0.7'
            os: ubuntu-26.04
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost/test
      DATABASE_CLEANER_ALLOW_REMOTE_DATABASE_URL: true
      BUNDLE_WITHOUT: console:development:journald
      FOREMAN_POSTGRES_IMAGE: postgres:13
    services:
      postgres:
        image: postgres:13
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: password
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/39912-explicit-syslog
      - name: Include the independent PostgreSQL client fix
        run: |
          git fetch origin fix/ubuntu26-postgresql-client
          git checkout FETCH_HEAD -- .github/scripts
          git fetch origin fix/39913-test-observer
          git checkout FETCH_HEAD -- bundler.d/test.rb
      - run: echo "$GITHUB_WORKSPACE/.github/scripts/postgresql" >> "$GITHUB_PATH"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev zlib1g-dev libpq-dev libvirt-dev libcap-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Include proposed Ruby 4 dependency prerequisites
        if: matrix.ruby == '4.0.7'
        run: |
          sed -i "s|^gem 'ldap_fluff'.*|gem 'ldap_fluff', '>= 0.9.0', '< 1.0', git: 'https://github.com/jakduch/ldap_fluff.git', branch: 'feature/ruby-4-support'|" Gemfile
          sed -i "s|^gem 'safemode'.*|gem 'safemode', '>= 2.0', '< 3', git: 'https://github.com/jakduch/safemode.git', branch: 'fix/54-ruby-4'|" Gemfile
      - name: Compare host and selected dump clients
        run: |
          /usr/bin/pg_dump --version
          pg_dump --version
      - run: bundle install --jobs 4 --retry 2
      - name: Test the wrapper and its style
        run: |
          bundle exec ruby .github/scripts/test_pg_dump.rb
          bundle exec rubocop .github/scripts/test_pg_dump.rb lib/foreman/logging.rb test/unit/foreman/logging_test.rb bundler.d/test.rb
      - name: Dump and restore the application schema
        run: |
          bin/rake db:create db:migrate
          bin/rake db:test:load_schema
      - name: Run logging regressions with a console test summary
        run: GITHUB_ACTIONS=false bin/rake test TEST=test/unit/foreman/logging_test.rb
      - name: Verify test factories can load
        run: bundle exec ruby -ractive_support -rfactory_bot -e 'puts FactoryBot::VERSION'
      - name: Investigate remaining Ruby 4 unit failures
        if: matrix.ruby == '4.0.7'
        run: bin/rake test:units

  probe:
    if: false
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '4.0.7'
            os: ubuntu-26.04
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost/test
      DATABASE_CLEANER_ALLOW_REMOTE_DATABASE_URL: true
      BUNDLE_WITHOUT: console:development:journald
    services:
      postgres:
        image: postgres:13
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: password
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev zlib1g-dev libpq-dev libvirt-dev libcap-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Record runtime versions
        run: |
          ruby --version
          bundle --version
          ruby -ropenssl -e 'puts OpenSSL::OPENSSL_VERSION; puts OpenSSL::OPENSSL_LIBRARY_VERSION'
      - name: Investigate the LDAP dependency fix
        run: |
          sed -i "s|^gem 'ldap_fluff'.*|gem 'ldap_fluff', '>= 0.9.0', '< 1.0', git: 'https://github.com/jakduch/ldap_fluff.git', branch: 'feature/ruby-4-support'|" Gemfile
          sed -i "s|^gem 'safemode'.*|gem 'safemode', '>= 2.0', '< 3', git: 'https://github.com/jakduch/safemode.git', branch: 'fix/54-ruby-4'|" Gemfile
      - name: Install application dependencies
        run: bundle install --jobs 4 --retry 2
      - name: Prepare database and boot application
        run: bin/rake db:create db:migrate
      - name: Run unit tests
        run: bin/rake test:units
      - name: Upload investigation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruby-${{ matrix.ruby }}-investigation
          path: |
            Gemfile.lock
            log/test.log
          retention-days: 3
